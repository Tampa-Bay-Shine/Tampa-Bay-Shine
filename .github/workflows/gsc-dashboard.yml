name: Refresh GSC GA4 and AI SEO Dashboard

on:
  workflow_dispatch:
    inputs:
      send_email:
        description: Send Daily SEO Performance Brief
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub cron uses UTC. These cover 8 AM Eastern in EDT and EST.
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"

permissions:
  contents: write

concurrency:
  group: gsc-ga4-seo-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Select 8 AM Eastern trigger
        id: eastern_schedule
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          year="$(date -u +%Y)"
          march_dow="$(date -u -d "$year-03-01" +%w)"
          march_second=$((8 + (7 - march_dow) % 7))
          nov_dow="$(date -u -d "$year-11-01" +%w)"
          nov_first=$((1 + (7 - nov_dow) % 7))
          start="$(date -u -d "$(printf '%04d-03-%02dT07:00:00Z' "$year" "$march_second")" +%s)"
          end="$(date -u -d "$(printf '%04d-11-%02dT06:00:00Z' "$year" "$nov_first")" +%s)"
          now="$(date -u +%s)"

          if [ "$now" -ge "$start" ] && [ "$now" -lt "$end" ]; then
            expected="0 12 * * *"
          else
            expected="0 13 * * *"
          fi

          echo "Scheduled: $EVENT_SCHEDULE"
          echo "Expected:  $expected"
          if [ "$EVENT_SCHEDULE" = "$expected" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain skipped DST trigger
        if: steps.eastern_schedule.outputs.run != 'true'
        run: echo "Skipping the UTC trigger that is not today's 8 AM Eastern occurrence."

      - name: Check out seo-dashboard
        if: steps.eastern_schedule.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: seo-dashboard

      - name: Set up Python
        if: steps.eastern_schedule.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google API dependencies
        if: steps.eastern_schedule.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            google-api-python-client \
            google-auth-httplib2 \
            google-auth-oauthlib \
            google-analytics-data

      - name: Create temporary Google credentials
        if: steps.eastern_schedule.outputs.run == 'true'
        shell: bash
        env:
          CLIENT_SECRET_B64: ${{ secrets.TBS_GSC_CLIENT_SECRET_B64 }}
          GSC_TOKEN_B64: ${{ secrets.TBS_GSC_TOKEN_B64 }}
          GA4_TOKEN_B64: ${{ secrets.TBS_GA4_TOKEN_B64 }}
        run: |
          set -euo pipefail

          if [ -z "$CLIENT_SECRET_B64" ] || \
             [ -z "$GSC_TOKEN_B64" ] || \
             [ -z "$GA4_TOKEN_B64" ]; then
            echo "Required Google API secrets are missing."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/tbs-gsc"
          mkdir -p "$RUNNER_TEMP/tbs-ga4"

          printf '%s' "$CLIENT_SECRET_B64" | \
            base64 --decode > "$RUNNER_TEMP/tbs-gsc/client_secret.json"

          printf '%s' "$GSC_TOKEN_B64" | \
            base64 --decode > "$RUNNER_TEMP/tbs-gsc/token.json"

          printf '%s' "$GA4_TOKEN_B64" | \
            base64 --decode > "$RUNNER_TEMP/tbs-ga4/token.json"

          chmod 600 "$RUNNER_TEMP/tbs-gsc/client_secret.json"
          chmod 600 "$RUNNER_TEMP/tbs-gsc/token.json"
          chmod 600 "$RUNNER_TEMP/tbs-ga4/token.json"

      - name: Refresh GSC dashboard data
        if: steps.eastern_schedule.outputs.run == 'true'
        run: |
          python tools/gsc_dashboard.py \
            --client-secret "$RUNNER_TEMP/tbs-gsc/client_secret.json" \
            --token "$RUNNER_TEMP/tbs-gsc/token.json" \
            --out "cloudflare-site/seo-dashboard/data/gsc.json" \
            --history-out "cloudflare-site/seo-dashboard/data/history.json"

      - name: Refresh Performance Intelligence
        if: steps.eastern_schedule.outputs.run == 'true'
        run: |
          python tools/performance_intelligence.py

      - name: Refresh GA4 dashboard data
        if: steps.eastern_schedule.outputs.run == 'true'
        run: |
          python tools/ga4_dashboard.py \
            --client-secret "$RUNNER_TEMP/tbs-gsc/client_secret.json" \
            --token "$RUNNER_TEMP/tbs-ga4/token.json" \
            --property "487638948" \
            --out "cloudflare-site/seo-dashboard/data/ga4.json" \
            --history-out "cloudflare-site/seo-dashboard/data/ga4-history.json"

      - name: Refresh AI referral dashboard data
        if: steps.eastern_schedule.outputs.run == 'true'
        run: |
          python tools/ai_dashboard.py \
            --client-secret "$RUNNER_TEMP/tbs-gsc/client_secret.json" \
            --token "$RUNNER_TEMP/tbs-ga4/token.json" \
            --property "487638948" \
            --out "cloudflare-site/seo-dashboard/data/ai.json" \
            --history-out "cloudflare-site/seo-dashboard/data/ai-history.json"

      - name: Refresh SEO AEO opportunity intelligence
        if: steps.eastern_schedule.outputs.run == 'true'
        run: |
          python tools/opportunity_intelligence.py

      - name: Sync SEO opportunity workflow
        if: steps.eastern_schedule.outputs.run == 'true'
        run: |
          python tools/opportunity_workflow.py sync

      - name: Verify only dashboard data changed
        if: steps.eastern_schedule.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          unexpected="$(
            git status --porcelain |
              grep -v -E 'cloudflare-site/seo-dashboard/data/(gsc|history|query-history|page-history|daily-total-history|performance-intelligence|ga4|ga4-history|ai|ai-history|opportunity-intelligence|opportunity-workflow)\.json$' ||
              true
          )"

          if [ -n "$unexpected" ]; then
            echo "Unexpected repository changes detected:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit refreshed dashboard data
        if: steps.eastern_schedule.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git add \
            cloudflare-site/seo-dashboard/data/gsc.json \
            cloudflare-site/seo-dashboard/data/history.json \
            cloudflare-site/seo-dashboard/data/query-history.json \
            cloudflare-site/seo-dashboard/data/page-history.json \
            cloudflare-site/seo-dashboard/data/daily-total-history.json \
            cloudflare-site/seo-dashboard/data/performance-intelligence.json \
            cloudflare-site/seo-dashboard/data/ga4.json \
            cloudflare-site/seo-dashboard/data/ga4-history.json \
            cloudflare-site/seo-dashboard/data/ai.json \
            cloudflare-site/seo-dashboard/data/ai-history.json \
            cloudflare-site/seo-dashboard/data/opportunity-intelligence.json \
            cloudflare-site/seo-dashboard/data/opportunity-workflow.json

          if git diff --cached --quiet; then
            echo "Dashboard data has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Refresh SEO dashboard data"
          git push origin HEAD:seo-dashboard

      - name: Send Daily SEO Performance Brief
        if: >-
          steps.eastern_schedule.outputs.run == 'true' &&
          (github.event_name == 'schedule' || inputs.send_email == true)
        shell: bash
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY GitHub Actions secret is missing."
            exit 1
          fi
          python tools/send_seo_email.py \
            --to "marketing@tampabayshine.com" \
            --from "Tampa Bay Shine SEO <seo@updates.tampabayshine.com>" \
            --reply-to "marketing@tampabayshine.com" \
            --dashboard-url "https://seo.tampabayshine.com/"
